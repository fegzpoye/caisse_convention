<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Les projets de Shaya — Stand</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:wght@400;500;700;900&display=swap');
  :root{
    --gold:#F5A623;--pink:#E94560;--purple:#8A5CF6;--purple2:#4C3A9C;
    --bg:#0a0a14;--white:#ffffff;--silver:#c0c0c0;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Exo 2',sans-serif;color:#fff}
  #app{position:fixed;inset:0}

  /* ── PARTICULES DE FOND (communes) ─────────────────────────── */
  .particles{position:fixed;inset:0;pointer-events:none;z-index:0}
  .particle{position:absolute;border-radius:50%;opacity:.15;animation:float linear infinite}
  @keyframes float{0%{transform:translateY(100vh) rotate(0deg);opacity:0}10%{opacity:.15}90%{opacity:.15}100%{transform:translateY(-100px) rotate(720deg);opacity:0}}

  /* ── ÉCRAN 1 : VEILLE ──────────────────────────────────────── */
  #idleScreen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;z-index:5;transition:background 1s ease;background:radial-gradient(circle at 50% 40%,#1a1730,#0a0a14 75%)}
  #idleScreen.buildup-wheel{background:radial-gradient(circle at 50% 40%,#7a1030 0%,#3a0a18 45%,#0a0a14 85%);animation:buildupFlashWheel 1.6s ease-in-out infinite}
  #idleScreen.buildup-scratch{background:radial-gradient(circle at 50% 40%,#5a2fc4 0%,#2a1560 45%,#0a0a14 85%);animation:buildupFlashScratch 1.6s ease-in-out infinite}
  @keyframes buildupFlashWheel{0%,100%{box-shadow:inset 0 0 120px rgba(233,69,96,.15)}50%{box-shadow:inset 0 0 220px rgba(233,69,96,.5)}}
  @keyframes buildupFlashScratch{0%,100%{box-shadow:inset 0 0 120px rgba(138,92,246,.15)}50%{box-shadow:inset 0 0 220px rgba(138,92,246,.5)}}
  .idle-logo-wrap{position:relative;width:260px;height:260px;display:flex;align-items:center;justify-content:center}
  .idle-logo-ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(245,166,35,.25);animation:ringPulse 3s ease-in-out infinite}
  .idle-logo-ring.r2{inset:-24px;animation-delay:.5s;border-color:rgba(245,166,35,.15)}
  @keyframes ringPulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.08);opacity:1}}
  #idleScreen.buildup .idle-logo-ring{border-width:4px;animation-duration:1s}
  #idleScreen.buildup-wheel .idle-logo-ring{border-color:rgba(233,69,96,.7)}
  #idleScreen.buildup-scratch .idle-logo-ring{border-color:rgba(138,92,246,.7)}
  .idle-logo{width:180px;height:180px;animation:logoBreathe 3.2s ease-in-out infinite;filter:drop-shadow(0 0 30px rgba(245,166,35,.35))}
  @keyframes logoBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .idle-title{font-family:'Bebas Neue',sans-serif;font-size:2.6rem;letter-spacing:8px;text-align:center;text-shadow:0 0 30px rgba(245,166,35,.4)}
  .idle-sub{font-size:.95rem;letter-spacing:3px;color:var(--silver);text-transform:uppercase;opacity:.7;transition:opacity .6s}
  .idle-status{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:5px;color:var(--gold);opacity:0;transform:scale(.85);transition:opacity .5s,transform .5s;text-align:center;min-height:32px}
  #idleScreen.buildup .idle-status{opacity:1;transform:scale(1);animation:statusFlash 1.2s ease-in-out infinite}
  @keyframes statusFlash{0%,100%{opacity:.6}50%{opacity:1}}
  #idleScreen.buildup .idle-logo-wrap{animation:none}
  #idleScreen.buildup .idle-logo{animation-duration:1s;filter:drop-shadow(0 0 46px rgba(245,166,35,.7))}
  #idleScreen.buildup-wheel .idle-status{color:var(--pink);text-shadow:0 0 24px rgba(233,69,96,.8)}
  #idleScreen.buildup-scratch .idle-status{color:var(--purple);text-shadow:0 0 24px rgba(138,92,246,.8)}

  /* ── ÉCRAN 2 : ROUE ────────────────────────────────────────── */
  #wheelScreen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:40px;z-index:10;background:radial-gradient(circle at 50% 35%,#1a1730,#0a0a14 80%)}
  #wheelScreen.active{display:flex}
  .wheel-wrapper{position:relative;width:min(80vw,520px);height:min(80vw,520px)}
  .wheel-glow{position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle,transparent 55%,rgba(233,69,96,.35) 70%,transparent 80%);animation:glowPulse 2s ease-in-out infinite;pointer-events:none}
  @keyframes glowPulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
  .wheel-ring{position:absolute;inset:-8px;border-radius:50%;border:4px solid var(--gold);box-shadow:0 0 24px rgba(245,166,35,.5),inset 0 0 20px rgba(245,166,35,.12)}
  canvas#wheelCanvas{width:100%;height:100%;border-radius:50%;display:block;filter:drop-shadow(0 0 30px rgba(233,69,96,.3))}
  .wheel-pointer{position:absolute;top:-34px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:34px solid var(--gold);filter:drop-shadow(0 0 8px rgba(245,166,35,.8));z-index:10}
  .wheel-hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:15%;height:15%;border-radius:50%;background:radial-gradient(circle,#fff 0%,var(--gold) 60%,#530636 100%);border:4px solid #fff;box-shadow:0 0 20px rgba(245,166,35,.8);z-index:10}
  .game-status{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:6px;color:var(--silver);text-align:center;min-height:40px}

  /* ── ÉCRAN 3 : CARTE À GRATTER ─────────────────────────────── */
  #scratchScreen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:32px;z-index:10;background:radial-gradient(circle at 50% 35%,#241a3a,#0a0a14 80%)}
  #scratchScreen.active{display:flex}
  .scratch-wrapper{position:relative;width:min(84vw,560px);aspect-ratio:16/10}
  .scratch-glow{position:absolute;inset:-20px;border-radius:32px;background:radial-gradient(circle,transparent 55%,rgba(138,92,246,.35) 70%,transparent 80%);animation:glowPulse 2s ease-in-out infinite;pointer-events:none}
  .scratch-ring{position:absolute;inset:-8px;border-radius:32px;border:4px solid var(--purple);box-shadow:0 0 24px rgba(138,92,246,.5),inset 0 0 20px rgba(138,92,246,.12)}
  .scratch-frame{position:relative;width:100%;height:100%;border-radius:24px;overflow:hidden;background:#1a1230;box-shadow:0 0 30px rgba(138,92,246,.3)}
  #prizeLayer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(160deg,#26215C,#1A1730)}
  #prizeEmoji{font-size:4rem}
  #prizeLabel{font-family:'Bebas Neue',sans-serif;font-size:3.4rem;letter-spacing:3px;color:#fff}
  #prizeSub{font-size:1.05rem;color:var(--silver);letter-spacing:1px}
  canvas#scratchCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
  .scratch-hint{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:5px;color:var(--silver);text-align:center;opacity:.85}

  /* ── OVERLAY RÉSULTAT (commun) ─────────────────────────────── */
  .win-overlay{position:fixed;inset:0;background:rgba(0,0,0,.87);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .5s;backdrop-filter:blur(6px)}
  .win-overlay.visible{opacity:1;pointer-events:all}
  .win-card{background:linear-gradient(135deg,#1a1a2e,#16213e);border:3px solid var(--gold);border-radius:28px;padding:50px 60px;text-align:center;box-shadow:0 0 80px rgba(245,166,35,.4);max-width:88vw;animation:winCardIn .6s cubic-bezier(.34,1.56,.64,1) both}
  @keyframes winCardIn{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(0deg);opacity:1}}
  .win-emoji{font-size:5rem;margin-bottom:14px;animation:bounce .6s ease infinite alternate}
  @keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-14px)}}
  .win-title{font-family:'Bebas Neue',sans-serif;font-size:3.2rem;letter-spacing:7px;color:var(--gold);margin-bottom:8px}
  .win-prize{font-family:'Bebas Neue',sans-serif;font-size:4.4rem;color:#fff;letter-spacing:3px;margin-bottom:16px;line-height:1}
  .win-sub{font-size:1.05rem;color:var(--silver);letter-spacing:1px}
  .confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:99}
  .firebase-status{position:fixed;top:14px;right:16px;display:flex;align-items:center;gap:6px;font-size:.7rem;color:rgba(255,255,255,.28);z-index:200;letter-spacing:2px}
  .fb-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 6px #4ade80;animation:fbPulse 2s ease-in-out infinite}
  .fb-dot.off{background:#e94560;box-shadow:0 0 6px #e94560}
  @keyframes fbPulse{0%,100%{opacity:1}50%{opacity:.4}}

  /* ── ÉCRAN "TOUCHEZ POUR DÉMARRER" (débloque le son iOS) ────── */
  #startOverlay{position:fixed;inset:0;background:rgba(5,5,12,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:1000;transition:opacity .5s}
  #startOverlay.hidden{opacity:0;pointer-events:none}
  .start-icon{font-size:4rem;animation:bounce .9s ease infinite alternate}
  .start-text{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:5px;text-align:center;color:var(--gold)}
  .start-sub{font-size:.85rem;color:var(--silver);letter-spacing:1px;text-align:center;opacity:.7}

  /* ── DEBUG (discret, coin bas gauche) ───────────────────────── */
  #debugBar{position:fixed;bottom:8px;left:8px;font-size:9px;color:rgba(255,255,255,.25);z-index:200;font-family:monospace;line-height:1.5;max-width:60vw;white-space:pre-wrap;pointer-events:none;display:none}
  #debugBar.err{color:#ff8080}

  /* ── OFFRE FLASH (identique à roue_Shaya.html) ───────────────── */
  @keyframes flashSlideUp{from{transform:translateY(120%);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes flashSlideDown2{from{transform:translateY(0);opacity:1}to{transform:translateY(120%);opacity:0}}
  @keyframes flashSlideInTop{from{transform:translateY(-120%);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes flashSlideOutTop{from{transform:translateY(0);opacity:1}to{transform:translateY(-120%);opacity:0}}
  @keyframes flashSlideInLeft{from{transform:translateX(-120%);opacity:0}to{transform:translateX(0);opacity:1}}
  @keyframes flashSlideOutLeft{from{transform:translateX(0);opacity:1}to{transform:translateX(-120%);opacity:0}}
  @keyframes flashSlideInRight{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
  @keyframes flashSlideOutRight{from{transform:translateX(0);opacity:1}to{transform:translateX(120%);opacity:0}}
  @keyframes flashTextGlow{0%,100%{text-shadow:0 0 20px rgba(255,215,0,.5)}50%{text-shadow:0 0 50px rgba(255,215,0,1),0 0 80px rgba(255,165,0,.8)}}
  @keyframes flashBounce{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
  @keyframes flashScan{0%{left:-100%}100%{left:200%}}
  #flashBottom{animation:flashSlideUp .6s cubic-bezier(.34,1.56,.64,1) forwards;}
  #flashBottom.hiding{animation:flashSlideDown2 .4s ease-in forwards;}
  #flashTop{animation:flashSlideInTop .6s cubic-bezier(.34,1.56,.64,1) forwards;}
  #flashTop.hiding{animation:flashSlideOutTop .4s ease-in forwards;}
  #flashLeft{animation:flashSlideInLeft .6s cubic-bezier(.34,1.56,.64,1) forwards;}
  #flashLeft.hiding{animation:flashSlideOutLeft .4s ease-in forwards;}
  #flashRight{animation:flashSlideInRight .6s cubic-bezier(.34,1.56,.64,1) forwards;}
  #flashRight.hiding{animation:flashSlideOutRight .4s ease-in forwards;}
  .flash-pct-big{animation:flashTextGlow 1.5s ease-in-out infinite,flashBounce 2s ease-in-out infinite;}
  .flash-bolt-anim{animation:flashBounce .8s ease-in-out infinite alternate;}
  .flash-scan-line{animation:flashScan 2s linear infinite;}
</style>
</head>
<body>

<div class="particles" id="particles"></div>
<canvas class="confetti-canvas" id="confettiCanvas"></canvas>
<div class="firebase-status"><div class="fb-dot" id="fbDot"></div><span id="fbLabel">CONNEXION...</span></div>
<div id="debugBar">initialisation...</div>

<div id="startOverlay">
  <div class="start-icon">👆</div>
  <div class="start-text">TOUCHEZ POUR DÉMARRER</div>
  <div class="start-sub">Active le son du stand pour la journée</div>
</div>

<div id="app">

  <!-- ÉCRAN VEILLE -->
  <div id="idleScreen">
    <div class="idle-logo-wrap">
      <div class="idle-logo-ring"></div>
      <div class="idle-logo-ring r2"></div>
      <img class="idle-logo" src="images/logo.png" alt="Les projets de Shaya">
    </div>
    <div>
      <div class="idle-title">LES PROJETS DE SHAYA</div>
      <div class="idle-sub" style="margin-top:8px">Impression 3D &amp; Sublimation</div>
    </div>
    <div class="idle-status" id="idleStatus">Préparez-vous...</div>
  </div>

  <!-- ÉCRAN ROUE -->
  <div id="wheelScreen">
    <div class="wheel-wrapper">
      <div class="wheel-glow"></div>
      <div class="wheel-ring"></div>
      <canvas id="wheelCanvas" width="600" height="600"></canvas>
      <div class="wheel-pointer"></div>
      <div class="wheel-hub"></div>
    </div>
    <div class="game-status" id="wheelStatus">LA ROUE TOURNE...</div>
  </div>

  <!-- ÉCRAN CARTE À GRATTER -->
  <div id="scratchScreen">
    <div class="scratch-wrapper">
      <div class="scratch-glow"></div>
      <div class="scratch-ring"></div>
      <div class="scratch-frame">
        <div id="prizeLayer">
          <div id="prizeEmoji">🎁</div>
          <div id="prizeLabel">—</div>
          <div id="prizeSub"></div>
        </div>
        <canvas id="scratchCanvas"></canvas>
      </div>
    </div>
    <div class="scratch-hint">GRATTEZ AVEC LE DOIGT</div>
  </div>

</div>

<div class="win-overlay" id="winOverlay">
  <div class="win-card">
    <div class="win-emoji" id="winEmoji">🎉</div>
    <div class="win-title" id="winTitle">FÉLICITATIONS !</div>
    <div class="win-prize" id="winPrize">-10%</div>
    <div class="win-sub" id="winSub">sur votre prochaine commande</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDji8NuTjQqD2YUaN-tfSe6t9BfWvWG7EQ",
  authDomain: "roue-shaya.firebaseapp.com",
  databaseURL: "https://roue-shaya-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "roue-shaya",
  storageBucket: "roue-shaya.firebasestorage.app",
  messagingSenderId: "1096623837864",
  appId: "1:1096623837864:web:b9a425fdce29bfb08a289d"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

onValue(ref(db,'.info/connected'),(snap)=>{
  const ok=snap.val();
  document.getElementById('fbDot').className='fb-dot'+(ok?'':' off');
  document.getElementById('fbLabel').textContent=ok?'FIREBASE CONNECTÉ':'HORS LIGNE';
  debugLog('connexion Firebase: '+(ok?'OK':'perdue'));
});

// ── Lots partagés (même logique que la roue existante) ─────────
const PRIZES = [
  {label:"Retente !",  sub:"Rejoue si perdu 🎲",         emoji:"🎲",type:"lose",     weight:10},
  {label:"-5%",        sub:"sur votre commande",          emoji:"💰",type:"reduction",weight:4},
  {label:"Pas de bol", sub:"Presque... la prochaine !",   emoji:"😬",type:"lose",     weight:10},
  {label:"-5%",        sub:"sur votre commande",          emoji:"💰",type:"reduction",weight:4},
  {label:"Dommage !",  sub:"Tente encore ta chance !",    emoji:"🙈",type:"lose",     weight:10},
  {label:"CADEAU",     sub:"Porte-clé imprimé 3D",        emoji:"🎁",type:"gift",     weight:1},
  {label:"-10%",       sub:"sur votre commande",          emoji:"🤑",type:"reduction",weight:1},
  {label:"BONUS",      sub:"Rejouer si perdu",            emoji:"✨",type:"gift",     weight:3},
  {label:"Oh non !",   sub:"La chance tourne... bientôt !",emoji:"😅",type:"lose",   weight:10},
  {label:"-15%",       sub:"sur votre commande",          emoji:"🔥",type:"reduction",weight:1},
  {label:"SURPRISE",   sub:"Cadeau mystère !",            emoji:"🎀",type:"gift",     weight:1},
  {label:"-5%",        sub:"sur votre commande",          emoji:"💰",type:"reduction",weight:4},
  {label:"Raté !",     sub:"Achète encore et retente !",  emoji:"😤",type:"lose",     weight:10},
  {label:"DRAGON",     sub:"Petit dragon offert",         emoji:"🐉",type:"gift",     weight:1},
];
const WHEEL_COLORS=["#2a2a3a","#1a7a4a","#1e1e2e","#E94560","#252535","#533483","#F5A623","#0F3460","#1e2a1e","#8B0000","#533483","#1a7a4a","#2a1a1a","#8B0000"];
const LOSE_MESSAGES = [
  { title:"PRESQUE !", sub:"La chance tourne... retente au prochain achat !" },
  { title:"OH NON !", sub:"Tu étais si proche ! Un autre achat = une autre chance 🎯" },
  { title:"DOMMAGE !", sub:"La roue ne ment pas... mais elle réessaie ! 😄" },
  { title:"RATÉ !", sub:"Achète encore et la fortune sourira ! 🍀" },
  { title:"PAS DE CHANCE !", sub:"Le destin te réserve quelque chose de mieux... bientôt !" },
];
function getWeightedPrize(){
  const tot=PRIZES.reduce((s,p)=>s+p.weight,0);let r=Math.random()*tot;
  for(let i=0;i<PRIZES.length;i++){r-=PRIZES[i].weight;if(r<=0)return i;}return 0;
}

// ── Particules de fond ───────────────────────────────────────
const pc=document.getElementById('particles');
for(let i=0;i<22;i++){
  const p=document.createElement('div'); p.className='particle';
  const sz=Math.random()*6+2, cols=['#E94560','#F5A623','#8A5CF6','#0F3460','#4ade80'];
  p.style.cssText=`width:${sz}px;height:${sz}px;background:${cols[Math.floor(Math.random()*5)]};left:${Math.random()*100}%;animation-duration:${Math.random()*15+10}s;animation-delay:${Math.random()*10}s`;
  pc.appendChild(p);
}

// ── SONS SYNTHÉTISÉS (Web Audio API — aucun fichier requis) ───
let audioCtx=null;
function getCtx(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
// Débloque l'audio dès la première interaction tactile de la journée
['touchstart','click'].forEach(evt=>document.addEventListener(evt,function unlock(){getCtx();document.removeEventListener(evt,unlock);},{once:true}));

function tone(freq,start,dur,type,gainPeak){
  const ctx=getCtx();
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.type=type||'sine';
  osc.frequency.setValueAtTime(freq,ctx.currentTime+start);
  gain.gain.setValueAtTime(0,ctx.currentTime+start);
  gain.gain.linearRampToValueAtTime(gainPeak||0.18,ctx.currentTime+start+0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+start+dur);
  osc.connect(gain);gain.connect(ctx.destination);
  osc.start(ctx.currentTime+start);osc.stop(ctx.currentTime+start+dur+0.05);
}
function playTransitionSound(){
  const ctx=getCtx();
  const osc=ctx.createOscillator(),gain=ctx.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(220,ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(880,ctx.currentTime+0.5);
  gain.gain.setValueAtTime(0.0001,ctx.currentTime);
  gain.gain.linearRampToValueAtTime(0.16,ctx.currentTime+0.08);
  gain.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.55);
  osc.connect(gain);gain.connect(ctx.destination);
  osc.start();osc.stop(ctx.currentTime+0.6);
}
function playWinSound(){
  tone(523.25,0,0.28,'triangle',0.2);
  tone(659.25,0.12,0.28,'triangle',0.2);
  tone(783.99,0.24,0.32,'triangle',0.22);
  tone(1046.5,0.38,0.5,'triangle',0.22);
}
function playLoseSound(){
  tone(392,0,0.35,'sine',0.14);
  tone(311.13,0.18,0.5,'sine',0.12);
}

// ── ÉTAT / MACHINE À ÉTATS ──────────────────────────────────────
let mode='wheel';        // 'wheel' | 'scratch'
let cartActive=false;
let isPlaying=false;
let currentPrizeIndex=null;

const idleScreen=document.getElementById('idleScreen');
const idleStatus=document.getElementById('idleStatus');
const wheelScreen=document.getElementById('wheelScreen');
const scratchScreen=document.getElementById('scratchScreen');

function updateIdleVisual(){
  idleScreen.classList.remove('buildup-wheel','buildup-scratch','buildup');
  if(cartActive && !isPlaying){
    idleScreen.classList.add('buildup', mode==='wheel'?'buildup-wheel':'buildup-scratch');
    idleStatus.textContent = mode==='wheel' ? '🎡 La roue se prépare...' : '🎟️ La carte se prépare...';
  } else {
    idleStatus.textContent='Préparez-vous...';
  }
}

onValue(ref(db,'stand/mode'),(snap)=>{
  const v=snap.val();
  debugLog('stand/mode = '+v);
  if(v==='wheel'||v==='scratch'){mode=v;updateIdleVisual();}
});
onValue(ref(db,'stand/cartActive'),(snap)=>{
  cartActive = snap.val()===true;
  debugLog('stand/cartActive = '+snap.val());
  updateIdleVisual();
});
onValue(ref(db,'stand/trigger'),(snap)=>{
  debugLog('stand/trigger = '+snap.val());
  if(snap.val()===true && !isPlaying) startGame();
});

function showScreen(which){
  idleScreen.style.display = which==='idle' ? 'flex' : 'none';
  wheelScreen.classList.toggle('active', which==='wheel');
  scratchScreen.classList.toggle('active', which==='scratch');
}

function startGame(){
  isPlaying=true;
  playTransitionSound();
  currentPrizeIndex=getWeightedPrize();
  setTimeout(()=>{
    if(mode==='wheel'){ showScreen('wheel'); spinWheel(currentPrizeIndex); }
    else { showScreen('scratch'); setupScratchCard(currentPrizeIndex); }
  }, 350);
}

function finishGame(prize){
  set(ref(db,'stand/lastResult'),{
    label:prize.label, sub:prize.sub, emoji:prize.emoji, type:prize.type, mode:mode, ts:Date.now()
  });
  set(ref(db,'stand/trigger'),false);
  showResult(prize);
}

function showResult(p){
  const isLose = p.type==='lose';
  const loseMsg = LOSE_MESSAGES[Math.floor(Math.random()*LOSE_MESSAGES.length)];
  document.getElementById('winEmoji').textContent=p.emoji;
  document.getElementById('winPrize').textContent = isLose ? loseMsg.title : p.label;
  document.getElementById('winSub').textContent = isLose ? loseMsg.sub : p.sub;
  const card=document.querySelector('.win-card');
  card.style.borderColor = isLose ? '#555' : 'var(--gold)';
  card.style.boxShadow = isLose ? '0 0 40px rgba(100,100,100,.3)' : '0 0 80px rgba(245,166,35,.4)';
  const titleEl=document.getElementById('winTitle');
  titleEl.textContent = isLose ? 'DOMMAGE !' : 'FÉLICITATIONS !';
  titleEl.style.color = isLose ? '#888' : 'var(--gold)';

  if(isLose) playLoseSound(); else { playWinSound(); launchConfetti(); }

  document.getElementById('winOverlay').classList.add('visible');

  setTimeout(()=>{
    document.getElementById('winOverlay').classList.remove('visible');
    stopConfetti();
    isPlaying=false;
    showScreen('idle');
    updateIdleVisual();
  }, 5000);
}

// ── ROUE ─────────────────────────────────────────────────────
const wheelCanvas=document.getElementById('wheelCanvas'), wctx=wheelCanvas.getContext('2d');
const WCX=wheelCanvas.width/2, WCY=wheelCanvas.height/2, WR=WCX-10;
let wheelAngle=0;

function drawWheel(angle){
  wctx.clearRect(0,0,wheelCanvas.width,wheelCanvas.height);
  const n=PRIZES.length, arc=(2*Math.PI)/n;
  PRIZES.forEach((p,i)=>{
    const s=angle+i*arc, e=s+arc;
    wctx.beginPath();wctx.moveTo(WCX,WCY);wctx.arc(WCX,WCY,WR,s,e);wctx.closePath();
    wctx.fillStyle=WHEEL_COLORS[i%WHEEL_COLORS.length];wctx.fill();
    wctx.strokeStyle='rgba(255,255,255,.15)';wctx.lineWidth=2;wctx.stroke();
    const mid=s+arc/2;
    wctx.save();wctx.translate(WCX+Math.cos(mid)*(WR*.58),WCY+Math.sin(mid)*(WR*.58));wctx.rotate(mid+Math.PI/2);
    wctx.font='22px serif';wctx.textAlign='center';wctx.textBaseline='middle';wctx.fillText(p.emoji,0,0);wctx.restore();
    wctx.save();wctx.translate(WCX+Math.cos(mid)*(WR*.80),WCY+Math.sin(mid)*(WR*.80));wctx.rotate(mid+Math.PI/2);
    wctx.font=`bold ${p.type==='lose'?15:17}px "Bebas Neue",sans-serif`;
    wctx.textAlign='center';wctx.textBaseline='middle';
    wctx.fillStyle= p.type==='lose' ? 'rgba(255,255,255,.4)' : '#fff';
    wctx.shadowColor='rgba(0,0,0,.8)';wctx.shadowBlur=4;
    wctx.fillText(p.label,0,0);wctx.restore();
  });
  wctx.beginPath();wctx.arc(WCX,WCY,WR,0,2*Math.PI);wctx.strokeStyle='rgba(255,255,255,.2)';wctx.lineWidth=3;wctx.stroke();
}
drawWheel(0);

function spinWheel(idx){
  document.getElementById('wheelStatus').textContent='LA ROUE TOURNE...';
  const n=PRIZES.length, arc=(2*Math.PI)/n;
  const target=-Math.PI/2-(idx*arc+arc/2);
  const extra=(5+Math.floor(Math.random()*4))*2*Math.PI;
  const total=extra+target-(wheelAngle%(2*Math.PI));
  const dur=4500+Math.random()*1200, t0=performance.now(), a0=wheelAngle;
  function ease(t){return 1-Math.pow(1-t,4);}
  function anim(now){
    const pr=Math.min((now-t0)/dur,1);
    wheelAngle=a0+total*ease(pr); drawWheel(wheelAngle);
    if(pr<1){requestAnimationFrame(anim);}
    else{
      wheelAngle=wheelAngle%(2*Math.PI);
      document.getElementById('wheelStatus').textContent='🎉 '+PRIZES[idx].label;
      finishGame(PRIZES[idx]);
    }
  }
  requestAnimationFrame(anim);
}

// ── CARTE À GRATTER (grattage réel au doigt) ────────────────────
const scratchCanvas=document.getElementById('scratchCanvas'), sctx=scratchCanvas.getContext('2d');
let scratchRevealed=false, scratchDrawing=false;

function sizeScratchCanvas(){
  const frame=document.querySelector('.scratch-frame');
  scratchCanvas.width=frame.clientWidth;
  scratchCanvas.height=frame.clientHeight;
  drawScratchLayer();
}
window.addEventListener('resize', ()=>{ if(scratchScreen.classList.contains('active')) sizeScratchCanvas(); });

function drawScratchLayer(){
  const g=sctx.createLinearGradient(0,0,scratchCanvas.width,scratchCanvas.height);
  g.addColorStop(0,'#8A5CF6');
  g.addColorStop(1,'#4C3A9C');
  sctx.globalCompositeOperation='source-over';
  sctx.fillStyle=g;
  sctx.fillRect(0,0,scratchCanvas.width,scratchCanvas.height);

  sctx.strokeStyle='rgba(255,255,255,.12)';
  sctx.lineWidth=1;
  for(let i=0;i<scratchCanvas.width;i+=18){
    sctx.beginPath();sctx.moveTo(i,0);sctx.lineTo(i,scratchCanvas.height);sctx.stroke();
  }

  // Badge vectoriel simplifié (violet/noir), sans dépendance à une image encodée
  const cx=scratchCanvas.width/2, cy=scratchCanvas.height/2-10;
  const scale=Math.min(scratchCanvas.width,scratchCanvas.height)/230;
  sctx.save();
  sctx.globalAlpha=.22;
  sctx.translate(cx,cy);sctx.scale(scale,scale);
  sctx.fillStyle='#fff';
  sctx.beginPath();
  sctx.roundRect(-60,-64,120,120,14);
  sctx.fill();
  sctx.restore();

  sctx.fillStyle='rgba(255,255,255,.9)';
  sctx.font='700 26px "Bebas Neue",sans-serif';
  sctx.textAlign='center';
  sctx.fillText('GRATTEZ ICI', scratchCanvas.width/2, scratchCanvas.height-24);
  scratchRevealed=false;
  sctx.globalCompositeOperation='source-over';
}

function setupScratchCard(idx){
  const prize=PRIZES[idx];
  document.getElementById('prizeEmoji').textContent=prize.emoji;
  document.getElementById('prizeLabel').textContent=prize.label;
  document.getElementById('prizeSub').textContent=prize.sub;
  sizeScratchCanvas();
}

function scratchAt(x,y){
  sctx.globalCompositeOperation='destination-out';
  sctx.beginPath();sctx.arc(x,y,34,0,Math.PI*2);sctx.fill();
  checkScratchReveal();
}
function checkScratchReveal(){
  if(scratchRevealed) return;
  const data=sctx.getImageData(0,0,scratchCanvas.width,scratchCanvas.height).data;
  let cleared=0,total=data.length/4;
  for(let i=3;i<data.length;i+=4*10){ if(data[i]===0) cleared++; }
  const ratio=cleared/(total/10);
  if(ratio>0.55){
    scratchRevealed=true;
    sctx.clearRect(0,0,scratchCanvas.width,scratchCanvas.height);
    finishGame(PRIZES[currentPrizeIndex]);
  }
}
function getScratchPos(e){
  const rect=scratchCanvas.getBoundingClientRect();
  const cx=e.touches?e.touches[0].clientX:e.clientX;
  const cy=e.touches?e.touches[0].clientY:e.clientY;
  return {x:cx-rect.left,y:cy-rect.top};
}
scratchCanvas.addEventListener('mousedown',e=>{scratchDrawing=true;const p=getScratchPos(e);scratchAt(p.x,p.y);});
scratchCanvas.addEventListener('mousemove',e=>{if(!scratchDrawing)return;const p=getScratchPos(e);scratchAt(p.x,p.y);});
window.addEventListener('mouseup',()=>{scratchDrawing=false;});
scratchCanvas.addEventListener('touchstart',e=>{scratchDrawing=true;const p=getScratchPos(e);scratchAt(p.x,p.y);},{passive:true});
scratchCanvas.addEventListener('touchmove',e=>{if(!scratchDrawing)return;e.preventDefault();const p=getScratchPos(e);scratchAt(p.x,p.y);},{passive:false});
scratchCanvas.addEventListener('touchend',()=>{scratchDrawing=false;});

// ── CONFETTIS ───────────────────────────────────────────────────
const cc=document.getElementById('confettiCanvas'), ccx=cc.getContext('2d');
let conf=[],canim=null;
function launchConfetti(){
  cc.width=window.innerWidth;cc.height=window.innerHeight;conf=[];
  for(let i=0;i<200;i++) conf.push({x:Math.random()*cc.width,y:-20-Math.random()*200,w:Math.random()*12+6,h:Math.random()*6+3,color:['#E94560','#F5A623','#8A5CF6','#4ade80','#fff','#60a5fa'][Math.floor(Math.random()*6)],vx:(Math.random()-.5)*4,vy:Math.random()*4+2,rot:Math.random()*360,vrot:(Math.random()-.5)*10});
  animConfetti();
}
function animConfetti(){
  ccx.clearRect(0,0,cc.width,cc.height);
  conf.forEach(c=>{c.x+=c.vx;c.y+=c.vy;c.rot+=c.vrot;ccx.save();ccx.translate(c.x,c.y);ccx.rotate(c.rot*Math.PI/180);ccx.fillStyle=c.color;ccx.fillRect(-c.w/2,-c.h/2,c.w,c.h);ccx.restore();});
  conf=conf.filter(c=>c.y<cc.height+50);
  if(conf.length>0)canim=requestAnimationFrame(animConfetti);
}
function stopConfetti(){if(canim)cancelAnimationFrame(canim);ccx.clearRect(0,0,cc.width,cc.height);}

// ── ÉCRAN "TOUCHEZ POUR DÉMARRER" — débloque le son iOS/Safari ──
const startOverlay=document.getElementById('startOverlay');
function unlockEverything(){
  const ctx=getCtx();
  // Joue un son quasi silencieux pour forcer le déblocage réel sur iOS
  const osc=ctx.createOscillator(),gain=ctx.createGain();
  gain.gain.value=0.0001;osc.connect(gain);gain.connect(ctx.destination);
  osc.start();osc.stop(ctx.currentTime+0.05);
  startOverlay.classList.add('hidden');
  setTimeout(()=>{startOverlay.style.display='none';},600);
  debugLog('Son débloqué ✓');
}
startOverlay.addEventListener('click',unlockEverything,{once:true});
startOverlay.addEventListener('touchstart',unlockEverything,{once:true});

// ── DEBUG À L'ÉCRAN (pas besoin d'accès à la console Safari) ────
const debugBar=document.getElementById('debugBar');
let debugLines=['prêt'];
function debugLog(msg){
  const t=new Date().toLocaleTimeString('fr-FR');
  debugLines.unshift('['+t+'] '+msg);
  if(debugLines.length>6) debugLines.pop();
  debugBar.textContent=debugLines.join('\n');
}
window.onerror=function(msg,src,line,col){
  debugBar.classList.add('err');
  debugLog('ERREUR JS: '+msg+' (ligne '+line+')');
};
debugLog('Script chargé, connexion Firebase...');

// ── OFFRE FLASH (identique à roue_Shaya.html) ────────────────────
let flashBannerTimer=null;
onValue(ref(db,'flash/offer'),(snap)=>{
  const data=snap.val();
  debugLog('flash/offer reçu: '+JSON.stringify(data));
  if(!data||!data.active){hideAllFlashBanners();return;}
  const remaining=data.endTime-Date.now();
  if(remaining<=0){hideAllFlashBanners();return;}
  showAllFlashBanners(data.pct,data.endTime);
});
function mkScanLine(){
  const d=document.createElement('div');
  d.className='flash-scan-line';
  d.style.cssText='position:absolute;top:0;left:-100%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);pointer-events:none';
  return d;
}
function showAllFlashBanners(pct,endTime){
  ['flashBottom','flashTop','flashLeft','flashRight'].forEach(id=>{const old=document.getElementById(id);if(old)old.remove();});
  if(flashBannerTimer){clearInterval(flashBannerTimer);flashBannerTimer=null;}
  const BG='linear-gradient(135deg,#0d0005 0%,#2d0010 25%,#c42d4a 50%,#2d0010 75%,#0d0005 100%)';
  const BORDER_B='3px solid #E94560';
  const W=60,H_TOP=54,H_BOT=76;

  const bottom=document.createElement('div');
  bottom.id='flashBottom';
  bottom.style.cssText=`position:fixed;bottom:0;left:${W}px;right:${W}px;height:${H_BOT}px;background:${BG};border-top:${BORDER_B};z-index:500;display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:14px;overflow:hidden;box-shadow:0 -6px 50px rgba(233,69,96,.6)`;
  bottom.appendChild(mkScanLine());
  bottom.innerHTML+=`
    <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
      <div class="flash-bolt-anim" style="font-size:1.9rem">⚡</div>
      <div><div style="font-family:'Bebas Neue',sans-serif;font-size:.6rem;letter-spacing:4px;color:rgba(255,255,255,.55)">OFFRE EXCLUSIVE</div>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:2px;color:#fff;line-height:1.1">OFFRE FLASH !</div></div>
    </div>
    <div style="text-align:center;flex:1">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:.6rem;letter-spacing:5px;color:rgba(255,255,255,.6)">REMISE EXCEPTIONNELLE</div>
      <div class="flash-pct-big" style="font-family:'Bebas Neue',sans-serif;font-size:2.8rem;line-height:1;letter-spacing:3px;color:#FFD700">-${pct}%</div>
    </div>
    <div style="text-align:center;background:rgba(0,0,0,.45);border:2px solid rgba(255,215,0,.35);border-radius:10px;padding:4px 14px;min-width:86px;flex-shrink:0">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:.5rem;letter-spacing:3px;color:rgba(255,255,255,.45)">TEMPS RESTANT</div>
      <div id="flashTimerBottom" style="font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:3px;color:#FFD700;line-height:1;transition:color .3s">--:--</div>
    </div>`;
  document.body.appendChild(bottom);

  const top=document.createElement('div');
  top.id='flashTop';
  top.style.cssText=`position:fixed;top:0;left:${W}px;right:${W}px;height:${H_TOP}px;background:${BG};border-bottom:${BORDER_B};z-index:500;display:flex;align-items:center;justify-content:center;gap:18px;overflow:hidden;box-shadow:0 6px 50px rgba(233,69,96,.6)`;
  top.appendChild(mkScanLine());
  top.innerHTML+=`
    <div class="flash-bolt-anim" style="font-size:1.6rem">⚡</div>
    <div style="font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:6px;color:#fff">OFFRE FLASH</div>
    <div class="flash-pct-big" style="font-family:'Bebas Neue',sans-serif;font-size:1.9rem;letter-spacing:3px;color:#FFD700">-${pct}%</div>
    <div style="font-family:'Bebas Neue',sans-serif;font-size:.8rem;letter-spacing:4px;color:rgba(255,255,255,.7)">SUR TOUT LE STAND !</div>
    <div class="flash-bolt-anim" style="font-size:1.6rem;animation-delay:.3s">⚡</div>`;
  document.body.appendChild(top);

  const left=document.createElement('div');
  left.id='flashLeft';
  left.style.cssText=`position:fixed;top:0;left:0;bottom:0;width:${W}px;background:${BG};border-right:${BORDER_B};z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;box-shadow:6px 0 50px rgba(233,69,96,.5)`;
  left.appendChild(mkScanLine());
  left.innerHTML+=`
    <div class="flash-bolt-anim" style="font-size:1.4rem">⚡</div>
    <div style="writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);font-family:'Bebas Neue',sans-serif;font-size:.95rem;letter-spacing:4px;color:#fff;white-space:nowrap">OFFRE FLASH</div>
    <div class="flash-pct-big" style="font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:#FFD700;letter-spacing:1px">-${pct}%</div>
    <div class="flash-bolt-anim" style="font-size:1.4rem;animation-delay:.4s">⚡</div>`;
  document.body.appendChild(left);

  const right=document.createElement('div');
  right.id='flashRight';
  right.style.cssText=`position:fixed;top:0;right:0;bottom:0;width:${W}px;background:${BG};border-left:${BORDER_B};z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;box-shadow:-6px 0 50px rgba(233,69,96,.5)`;
  right.appendChild(mkScanLine());
  right.innerHTML+=`
    <div class="flash-bolt-anim" style="font-size:1.4rem">⚡</div>
    <div style="writing-mode:vertical-rl;text-orientation:mixed;font-family:'Bebas Neue',sans-serif;font-size:.95rem;letter-spacing:4px;color:#fff;white-space:nowrap">OFFRE FLASH</div>
    <div class="flash-pct-big" style="font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:#FFD700;letter-spacing:1px">-${pct}%</div>
    <div class="flash-bolt-anim" style="font-size:1.4rem;animation-delay:.4s">⚡</div>`;
  document.body.appendChild(right);

  flashBannerTimer=setInterval(()=>{
    const rem=endTime-Date.now();
    if(rem<=0){hideAllFlashBanners();return;}
    const m=Math.floor(rem/60000),s=Math.floor((rem%60000)/1000);
    const str=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
    const el=document.getElementById('flashTimerBottom');
    if(el){el.textContent=str;el.style.color=rem<30000?'#FF3333':rem<60000?'#FF8C00':'#FFD700';}
  },1000);
}
function hideAllFlashBanners(){
  if(flashBannerTimer){clearInterval(flashBannerTimer);flashBannerTimer=null;}
  ['flashBottom','flashTop','flashLeft','flashRight'].forEach(id=>{
    const b=document.getElementById(id);
    if(b){b.classList.add('hiding');setTimeout(()=>{if(b&&b.parentNode)b.remove();},450);}
  });
}

showScreen('idle');
updateIdleVisual();
</script>
